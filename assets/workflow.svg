<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
<title id="title">The Leo Dev development flow</title><desc id="desc">One specification and design, an explicit task plan, implementation and checks, independent review, and release evidence. Rejected reviews return to implementation.</desc>
