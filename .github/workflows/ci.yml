name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest tests/test_doctor.py
      - run: node --test examples/mochi-board/tests/*.test.mjs
      - run: npm run build:adapters
      - run: npm run verify:packages
      - run: npm run build:marketplace
